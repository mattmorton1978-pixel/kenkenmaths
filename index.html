<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple KenKen</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
  .app{max-width:900px;margin:auto;padding:24px}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:30px}.sub{color:#61708a;margin:5px 0 0}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button,select{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:white;box-shadow:0 2px 8px #00000014;cursor:pointer}
  button:hover{transform:translateY(-1px)} button.primary{background:#2457d6;color:white}
  .panel{background:white;border-radius:16px;padding:18px;margin-top:20px;box-shadow:0 4px 18px #00000010}
  .info{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .message{font-weight:700}.good{color:#18864b}.bad{color:#c43b3b}
  .board-wrap{display:flex;justify-content:center;margin:20px 0}
  #board{display:grid;position:relative;border:4px solid #172033;background:#172033;gap:2px}
  .cell{position:relative;background:white;display:flex;align-items:center;justify-content:center}
  .cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:30px;font-weight:700;outline:none;cursor:pointer}
  .cell input:focus{background:#eaf0ff}
  .cell.invalid{background:#ffe8e8}
  .cell.correct{background:#e8f8ef}
  .cage{position:absolute;pointer-events:none}
  .label{position:absolute;top:3px;left:5px;font-size:14px;font-weight:800;background:#fff;padding:1px 3px;border-radius:3px}
  .help{color:#61708a;font-size:14px;line-height:1.5}
  .stats{display:flex;gap:24px;flex-wrap:wrap}.stat strong{display:block;font-size:22px}
  @media(max-width:600px){.app{padding:14px}.cell input{font-size:24px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>🧩 KenKen</h1><div class="sub">Use each number once in every row and column.</div></div>
  <div class="controls">
    <label><select id="size"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option></select></label>
    <label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
    <button class="primary" id="newBtn">New Puzzle</button>
  </div>
</header>

<section class="panel">
  <div class="info">
    <div><span id="status" class="message">Fill the grid!</span></div>
    <div>⏱ <span id="timer">00:00</span></div>
  </div>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="info">
    <div class="controls">
      <button id="checkBtn">Check Puzzle</button>
      <button id="hintBtn">💡 Hint</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="help">Tap a square and type a number, or use the number keys.</div>
  </div>
</section>

<section class="panel stats">
  <div class="stat">Mistakes<strong id="mistakes">0</strong></div>
  <div class="stat">Hints<strong id="hints">0</strong></div>
  <div class="stat">Puzzle<strong id="puzzleNo">1</strong></div>
</section>
</div>

<script>
const SIZE_OPTIONS=[3,4,5];
let N=4, difficulty='medium', solution=[], cages=[], timer=0, timerId=null, mistakes=0,hints=0,puzzleNo=1;

const $=id=>document.getElementById(id);

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function latinSquare(n){
  const base=[...Array(n)].map((_,i)=>i);
  let rows=shuffled(base), cols=shuffled(base), nums=shuffled(base.map(x=>x+1));
  return rows.map(r=>cols.map(c=>nums[(r+c)%n]));
}

function makeCages(sol,n){
  const un=new Set([...Array(n*n)].map((_,i)=>i));
  const targetCages=[];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(un.size){
    const start=[...un][Math.floor(Math.random()*un.size)];
    let maxSize = n===3 ? 2 : (difficulty==='easy'?2:difficulty==='medium'?3:4);
    if(Math.random()<.25) maxSize=1;
    const cells=[start], used=new Set([start]);
    un.delete(start);
    while(cells.length<maxSize){
      const choices=[];
      for(const id of cells){
        const r=Math.floor(id/n),c=id%n;
        for(const [dr,dc] of dirs){
          const nr=r+dr,nc=c+dc,ni=nr*n+nc;
          if(nr>=0&&nr<n&&nc>=0&&nc<n&&un.has(ni)&&!used.has(ni)) choices.push(ni);
        }
      }
      if(!choices.length) break;
      const next=choices[Math.floor(Math.random()*choices.length)];
      cells.push(next);used.add(next);un.delete(next);
    }
    const vals=cells.map(i=>sol[Math.floor(i/n)][i%n]);
    let op='',target;
    if(cells.length===1){op='';target=vals[0]}
    else if(cells.length===2){
      if(vals[0]*vals[1]<=n*n && Math.random()<.5){op='×';target=vals[0]*vals[1]}
      else if(Math.max(...vals)%Math.min(...vals)===0){op='÷';target=Math.max(...vals)/Math.min(...vals)}
      else {op='−';target=Math.abs(vals[0]-vals[1])}
      if(target===0){op='+';target=vals[0]+vals[1]}
    } else {
      if(Math.random()<.55){op='+';target=vals.reduce((a,b)=>a+b,0)}
      else {op='×';target=vals.reduce((a,b)=>a*b,1)}
    }
    targetCages.push({cells,op,target});
  }
  return targetCages;
}

function cageValid(cage,vals){
  if(vals.some(v=>!v)) return true;
  const t=cage.target;
  if(!cage.op)return vals[0]===t;
  if(cage.op==='+')return vals.reduce((a,b)=>a+b,0)===t;
  if(cage.op==='×')return vals.reduce((a,b)=>a*b,1)===t;
  if(cage.op==='−')return Math.abs(vals[0]-vals[1])===t;
  if(cage.op==='÷')return Math.max(...vals)/Math.min(...vals)===t;
}

function drawCage(cage){
  const board=$('board'), cellSize=board.clientWidth/N;
  const ids=cage.cells, rs=ids.map(i=>Math.floor(i/N)), cs=ids.map(i=>i%N);
  const minR=Math.min(...rs),maxR=Math.max(...rs),minC=Math.min(...cs),maxC=Math.max(...cs);
  const div=document.createElement('div');div.className='cage';
  div.style.left=(minC*cellSize)+'px';div.style.top=(minR*cellSize)+'px';
  div.style.width=((maxC-minC+1)*cellSize)+'px';div.style.height=((maxR-minR+1)*cellSize)+'px';
  const b='3px solid #172033';
  for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){
    const id=r*N+c;if(!ids.includes(id))continue;
    const top=r===minR||!ids.includes(id-N),bottom=r===maxR||!ids.includes(id+N);
    const left=c===minC||!ids.includes(id-1),right=c===maxC||!ids.includes(id+1);
    const e=document.createElement('div');e.style.position='absolute';
    e.style.left=(c-minC)*cellSize+'px';e.style.top=(r-minR)*cellSize+'px';
    e.style.width=cellSize+'px';e.style.height=cellSize+'px';
    e.style.borderTop=top?b:'0';e.style.borderBottom=bottom?b:'0';
    e.style.borderLeft=left?b:'0';e.style.borderRight=right?b:'0';
    div.appendChild(e);
  }
  const lab=document.createElement('span');lab.className='label';lab.textContent=cage.target+(cage.op||'');
  div.appendChild(lab);board.appendChild(div);
}

function build(){
  N=+$('size').value; difficulty=$('difficulty').value;
  solution=latinSquare(N); cages=makeCages(solution,N);
  const board=$('board');board.innerHTML='';
  const side=Math.min(560,window.innerWidth-50);board.style.width=side+'px';board.style.height=side+'px';
  board.style.gridTemplateColumns=`repeat(${N},1fr)`;board.style.gridTemplateRows=`repeat(${N},1fr)`;
  for(let i=0;i<N*N;i++){
    const cell=document.createElement('div');cell.className='cell';
    const input=document.createElement('input');input.type='text';input.inputMode='numeric';input.maxLength=1;
    input.dataset.i=i;
    input.addEventListener('input',e=>{
      e.target.value=e.target.value.replace(/[^1-9]/g,'').slice(0,1);
      if(+e.target.value>N)e.target.value='';
      e.target.parentElement.classList.remove('invalid','correct');
    });
    cell.appendChild(input);board.appendChild(cell);
  }
  cages.forEach(drawCage);
  $('status').textContent='Fill the grid!';$('status').className='message';
  resetTimer();mistakes=0;hints=0;updateStats();
}

function values(){return [...document.querySelectorAll('.cell input')].map(x=>+x.value||0)}
function check(){
  const vals=values();let complete=vals.every(Boolean), valid=true;
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('invalid','correct'));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=vals[r*N+c], arr=vals.slice(r*N,r*N+N).filter(x=>x);
    const col=vals.filter((_,i)=>i%N===c&&vals[i]);
    const dup=(v&&arr.filter(x=>x===v).length>1)||(v&&col.filter(x=>x===v).length>1);
    if(dup){document.querySelector(`.cell:nth-child(${r*N+c+1})`).classList.add('invalid');valid=false}
  }
  cages.forEach(c=>{
    const cv=c.cells.map(i=>vals[i]);
    if(cv.every(Boolean)&&!cageValid(c,cv)){c.cells.forEach(i=>document.querySelector(`.cell:nth-child(${i+1})`).classList.add('invalid'));valid=false}
  });
  if(!complete){$('status').textContent=valid?'Keep going — you’re on the right track!':'Check the red squares.';$('status').className='message '+(valid?'good':'bad');return}
  if(valid&&vals.every((v,i)=>v===solution[Math.floor(i/N)][i%N])){
    $('status').textContent='🎉 Brilliant! Puzzle solved!';$('status').className='message good';
    clearInterval(timerId);document.querySelectorAll('.cell').forEach(c=>c.classList.add('correct'));
  }else{$('status').textContent='Not quite — check the red squares.';$('status').className='message bad';mistakes++;updateStats()}
}

function hint(){
  const vals=values(), choices=vals.map((v,i)=>v===solution[Math.floor(i/N)][i%N]?null:i).filter(i=>i!==null);
  if(!choices.length)return;
  const i=choices[Math.floor(Math.random()*choices.length)];
  const input=document.querySelectorAll('.cell input')[i];input.value=solution[Math.floor(i/N)][i%N];
  input.parentElement.classList.add('correct');hints++;updateStats();
}
function updateStats(){$('mistakes').textContent=mistakes;$('hints').textContent=hints;$('puzzleNo').textContent=puzzleNo}
function resetTimer(){clearInterval(timerId);timer=0;$('timer').textContent='00:00';timerId=setInterval(()=>{timer++;let m=String(Math.floor(timer/60)).padStart(2,'0'),s=String(timer%60).padStart(2,'0');$('timer').textContent=m+':'+s},1000)}

$('newBtn').onclick=()=>{puzzleNo++;build()};
$('size').onchange=build;$('difficulty').onchange=build;
$('checkBtn').onclick=check;$('hintBtn').onclick=hint;
$('clearBtn').onclick=()=>{document.querySelectorAll('.cell input').forEach(x=>{x.value='';x.parentElement.classList.remove('invalid','correct')});$('status').textContent='Fill the grid!';$('status').className='message'};
build();
</script>
</body>
</html>
